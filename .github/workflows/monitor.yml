name: Craigslist Gig Monitor

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit seen.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_SMS_GATEWAY: ${{ secrets.ALERT_SMS_GATEWAY }}
        run: python monitor.py

      - name: Commit updated seen-state
        run: |
          git config user.name "gig-monitor-bot"
          git config user.email "actions@github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "Update seen posts [skip ci]"
          git push
