name: COAI Bakersfield Auto-Finder

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min
  workflow_dispatch: {}     # manual Run workflow button

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run Bakersfield finder
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_bakersfield.py
      - name: Commit seen state
        run: |
          git config user.name "coai-bot"
          git config user.email "actions@github.com"
          git add data/seen_bakersfield.json
          git diff --cached --quiet || git commit -m "Update Bakersfield seen [skip ci]"
          git push
